    <a class="skip" href="#board-stage">Skip to board</a>

    <div class="app">
        <header class="topbar">
            <div class="brand">
                <svg class="logo" viewBox="0 0 48 48" width="40" height="40" aria-hidden="true" focusable="false">
                    <path d="M7 36C13 22 23 11 35 5c-2 11 1 23 8 31z" fill="currentColor"/>
                    <path d="M6 42c4-3 8-3 12 0s8 3 12 0 8-3 12 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                </svg>
                <div>
                    <h1>Shark</h1>
                    <p class="tagline">A chess engine written from scratch in C++</p>
                </div>
            </div>
            <div class="topbar-end">
                <div class="elo" id="elo-badge">
                    <div class="elo-line">
                        <span class="elo-value" id="elo-value">...</span>
                        <span class="elo-unit" id="elo-unit">Elo</span>
                    </div>
                    <span class="elo-note" id="elo-note">Loading rating</span>
                </div>
                <button type="button" class="icon-btn" id="theme-btn" aria-label="Switch to light theme" title="Switch theme">
                    <svg class="icon" aria-hidden="true"><use id="theme-icon" href="#i-sun"/></svg>
                </button>
            </div>
        </header>

        <main>
            <section class="setup" aria-label="Match setup">
                <fieldset class="side" id="white-side">
                    <legend class="side-head">
                        <img src="img/wikipedia/wK.png" alt="" width="28" height="28">
                        <span>White</span>
                    </legend>
                    <div class="fields">
                        <div class="field field-wide">
                            <label for="white-player">Player</label>
                            <select id="white-player"></select>
                            <p class="help" id="white-desc"></p>
                        </div>
                        <div class="field">
                            <label for="white-pers">Personality</label>
                            <select id="white-pers" class="pers-select"></select>
                        </div>
                        <div class="field">
                            <label for="white-mt">Time per move (ms)</label>
                            <input id="white-mt" type="number" inputmode="numeric" placeholder="Default" min="10" step="10">
                        </div>
                        <p class="help field-wide" id="white-pers-desc"></p>
                    </div>
                </fieldset>

                <button type="button" class="icon-btn swap" id="swap-btn" aria-label="Swap colors" title="Swap colors">
                    <svg class="icon" aria-hidden="true"><use href="#i-arrows-left-right"/></svg>
                </button>

                <fieldset class="side" id="black-side">
                    <legend class="side-head">
                        <img src="img/wikipedia/bK.png" alt="" width="28" height="28">
                        <span>Black</span>
                    </legend>
                    <div class="fields">
                        <div class="field field-wide">
                            <label for="black-player">Player</label>
                            <select id="black-player"></select>
                            <p class="help" id="black-desc"></p>
                        </div>
                        <div class="field">
                            <label for="black-pers">Personality</label>
                            <select id="black-pers" class="pers-select"></select>
                        </div>
                        <div class="field">
                            <label for="black-mt">Time per move (ms)</label>
                            <input id="black-mt" type="number" inputmode="numeric" placeholder="Default" min="10" step="10">
                        </div>
                        <p class="help field-wide" id="black-pers-desc"></p>
                    </div>
                </fieldset>

                <div class="setup-foot">
                    <p class="setup-error hidden" id="setup-error" role="alert"></p>
                    <div class="field opening-field" id="opening-wrap" hidden>
                        <label for="opening-select">Opening</label>
                        <select id="opening-select"></select>
                    </div>
                    <button type="button" id="start-btn" class="btn btn-primary">Start game</button>
                </div>
            </section>

            <div class="arena">
                <section class="board-panel" aria-label="Board">
                    <div class="stage" id="board-stage" tabindex="-1">
                        <div class="plate" id="plate-top"></div>
                        <div id="board"></div>
                        <div class="plate" id="plate-bottom"></div>
                    </div>
                    <div class="controls">
                        <div class="transport">
                            <button type="button" id="first-btn" class="icon-btn hidden" aria-label="First position" title="First position (Home)"><svg class="icon" aria-hidden="true"><use href="#i-skip-back"/></svg></button>
                            <button type="button" id="prev-btn" class="icon-btn hidden" aria-label="Previous move" title="Previous move (Left arrow)"><svg class="icon" aria-hidden="true"><use href="#i-caret-left"/></svg></button>
                            <button type="button" id="play-btn" class="icon-btn icon-btn-solid hidden" aria-label="Replay automatically" title="Replay (Space)"><svg class="icon" aria-hidden="true"><use id="play-icon" href="#i-play"/></svg></button>
                            <button type="button" id="next-btn" class="icon-btn hidden" aria-label="Next move" title="Next move (Right arrow)"><svg class="icon" aria-hidden="true"><use href="#i-caret-right"/></svg></button>
                            <button type="button" id="last-btn" class="icon-btn hidden" aria-label="Latest position" title="Latest position (End)"><svg class="icon" aria-hidden="true"><use href="#i-skip-forward"/></svg></button>
                        </div>
                        <div class="board-tools">
                            <button type="button" id="undo-btn" class="btn btn-quiet hidden"><svg class="icon" aria-hidden="true"><use href="#i-arrow-counter-clockwise"/></svg>Undo</button>
                            <button type="button" id="flip-btn" class="btn btn-quiet" title="Flip board (F)"><svg class="icon" aria-hidden="true"><use href="#i-arrows-down-up"/></svg>Flip</button>
                            <span id="ply-indicator" class="ply-indicator"></span>
                        </div>
                    </div>
                </section>

                <aside class="side-panel" aria-label="Game">
                    <p class="status" id="status" role="status" aria-live="polite">Choose two players and press Start game.</p>

                    <div class="result hidden" id="result">
                        <p class="result-text" id="result-text"></p>
                        <div class="result-actions">
                            <button type="button" id="rematch-btn" class="btn btn-quiet"><svg class="icon" aria-hidden="true"><use href="#i-arrow-clockwise"/></svg>Rematch</button>
                            <button type="button" id="pgn-btn" class="btn btn-quiet"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg>Copy PGN</button>
                        </div>
                    </div>

                    <h2 class="moves-title">Moves</h2>
                    <div class="moves-head" aria-hidden="true"><span></span><span>White</span><span>Black</span></div>
                    <div id="moves-list" class="moves"></div>
                </aside>
            </div>
        </main>

        <footer class="foot">
            <span>Shark uses bitboards, alpha-beta search, Lazy SMP and UCI.</span>
            <a href="https://github.com/Agam991/Shark" target="_blank" rel="noopener">GitHub</a>
        </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="vendor/jquery-3.7.1.min.js"></script>
    <script src="vendor/chessboard-1.0.0.min.js"></script>
    <script src="vendor/chess-0.10.3.js"></script>
    <script src="app.js"></script>
</body>
</html>
